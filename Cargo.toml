[workspace]
members = ["app", "tap", "common"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.82"

[workspace.dependencies]
windows = { version = "0.58", features = [
    "implement", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Com", "Win32_System_Ole", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_System_WinRT",
    "Win32_System_Registry", "Win32_System_Wmi", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop",
] }
clearbar-common = { path = "common" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
